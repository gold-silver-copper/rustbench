id = "rename-item-struct"
suite = "edits"
kind = "edit"
split = "dev"
difficulty = 2
summary = "rename struct `Item` to `StockItem` across modules and main"

[prompt]
terse = "Rename the struct `Item` to `StockItem` across the whole crate."
